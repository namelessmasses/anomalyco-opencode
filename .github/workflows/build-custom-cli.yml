name: Build custom OpenCode CLI

on:
  push:
    branches: [feat/claude-multi-account]
    paths:
      - '.github/workflows/build-custom-cli.yml'
      - 'packages/core/src/plugin/provider/claude-agent/**'
      - 'packages/core/test/plugin/provider/claude-agent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Core typecheck
        working-directory: packages/core
        run: bun typecheck
      - name: Claude Agent tests
        working-directory: packages/core
        run: bun test test/plugin/provider/claude-agent
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: linux-x64
            artifact: opencode-custom-linux-x64
          - runner: windows-latest
            target: windows-x64
            artifact: opencode-custom-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build CLI
        working-directory: packages/cli
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/cli-${{ matrix.target }}/bin/
          retention-days: 7
          if-no-files-found: error
